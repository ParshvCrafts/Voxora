[package]
name = "voxora"
description = "Local-first AI voice dictation for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "voxora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
cpal = "0.18.2"
earshot = "1.2.2"
rubato = "5.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
voxora-core = { path = "../crates/voxora-core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_System_JobObjects", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Ole"] }
