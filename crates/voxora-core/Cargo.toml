[package]
name = "voxora-core"
description = "Platform-neutral text pipeline for Voxora: normalizer, spoken math, LLM guard, storage."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aho-corasick = "1.1.5"
flate2 = "1.1.11"
futures-util = "0.3.34"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "stream", "native-tls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["time", "rt", "macros", "rt-multi-thread"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
